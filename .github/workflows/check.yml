name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax and style
        run: |
          bash -n -- *.sh
          shellcheck -- *.sh
          GOBIN="$RUNNER_TEMP" go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          "$RUNNER_TEMP/shfmt" -d -- *.sh
          GOBIN="$RUNNER_TEMP" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint"
      - name: Check complete installer flow
        run: |
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          mkdir -p "$test_dir/bin" "$test_dir/home"
          cat > "$test_dir/bin/mock" <<'EOF'
          #!/usr/bin/env bash
          case ${0##*/} in
            curl) printf '%s\n' '#!/usr/bin/env bash' 'exit 0' ;;
            sudo) [[ ${1:-} == -v ]] || exec "$@" ;;
          esac
          EOF
          chmod +x "$test_dir/bin/mock"
          for command in curl sudo git gh jq make go node npm npx codex claude shellcheck shfmt rg actionlint; do
            ln -s mock "$test_dir/bin/$command"
          done
          PATH="$test_dir/bin:$PATH" HOME="$test_dir/home" \
            LINUX_TOOLBOX_NONINTERACTIVE=1 bash install.sh |
            grep -F "Setup complete"
      - name: Check Node installer flow
        run: |
          test_home=$(mktemp -d)
          trap 'rm -rf "$test_home"' EXIT
          mkdir -p "$test_home/.nvm"
          cat > "$test_home/.nvm/nvm.sh" <<'EOF'
          nvm() {
            case $1 in
              install) echo "internal install output" ;;
              alias) ;;
              version) echo "v24.20.0" ;;
            esac
          }
          EOF
          output=$(HOME="$test_home" NVM_DIR="$test_home/.nvm" bash install-node.sh 2>&1)
          test -z "$output"
          test "$(readlink "$test_home/.nvm/versions/node/current")" = \
            "$test_home/.nvm/versions/node/v24.20.0"
