name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the run it makes outdated; a run on main is never cancelled once it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          LINUX_TOOLBOX_BIN_DIR="$RUNNER_TEMP" bash install-shell-tools.sh
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check syntax and style
        run: make check
      # A pseudo-terminal whose input never ends: a prompt that ignores non-interactive mode hangs and fails the step.
      - name: Test installer behavior
        run: timeout 300 script -qec 'make test' /dev/null < <(sleep 600)
