name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install check tools
        run: |
          LINUX_TOOLBOX_BIN_DIR="$RUNNER_TEMP" bash install-shell-tools.sh
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check syntax and style
        run: make check
      - name: Test installer behavior
        run: make test
