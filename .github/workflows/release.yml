name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  checks: read
  contents: write
  pull-requests: read

jobs:
  release:
    name: Publish scripts
    # Only merged release PRs from this repository: forks cannot publish.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    # Every closed PR starts this workflow, so the queue is on the job: a skipped
    # job never joins it and cannot cancel a release that is waiting.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require passing checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This workflow is itself one of the PR's checks, so leave it out.
          checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json bucket,workflow)
          jq -e --arg self "$GITHUB_WORKFLOW" '[.[] | select(.workflow != $self)] |
            length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<< "$checks"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      # The PR's Check run already passed make check and make test; nothing downloaded runs in this job.
      - name: Validate tag
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$RELEASE_BRANCH" =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          printf 'RELEASE_TAG=%s\n' "${RELEASE_BRANCH#dev/}" >> "$GITHUB_ENV"
      - name: Prepare pinned installer
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir dist
          cp -- *.sh dist/
          sed -i "s#^base_url=.*#base_url=https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}#" dist/install.sh
          grep -Fx "base_url=https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}" dist/install.sh
          # Lets a download be checked with: sha256sum -c --ignore-missing SHA256SUMS
          (cd dist && sha256sum -- *.sh >SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          release_args=()
          [[ "$RELEASE_TAG" == *-* ]] && release_args+=(--prerelease)
          # The release PR body holds the grouped changelog written by gh-release-flow open-pr.
          if [[ -n $PR_BODY ]]; then release_args+=(--notes "$PR_BODY"); else release_args+=(--generate-notes); fi
          # Without --title, a release with --notes has no name; name it after its tag.
          gh release create "$RELEASE_TAG" dist/*.sh dist/SHA256SUMS --title "$RELEASE_TAG" --target "$MERGE_SHA" "${release_args[@]}"
