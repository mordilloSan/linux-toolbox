name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Publish scripts
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate tag and scripts
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$RELEASE_BRANCH" =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'RELEASE_TAG=%s\n' "${RELEASE_BRANCH#dev/}" >> "$GITHUB_ENV"
          bash -n -- *.sh
          shellcheck -- *.sh
          GOBIN="$RUNNER_TEMP" go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          "$RUNNER_TEMP/shfmt" -d -- *.sh
          GOBIN="$RUNNER_TEMP" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint"
      - name: Prepare pinned installer
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir dist
          cp -- *.sh dist/
          sed -i "s#^base_url=.*#base_url=https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}#" dist/install.sh
          grep -Fx "base_url=https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}" dist/install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: gh release create "$RELEASE_TAG" dist/*.sh --target "$MERGE_SHA" --generate-notes
