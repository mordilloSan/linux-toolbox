name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  checks: read
  contents: write
  pull-requests: read

jobs:
  release:
    name: Publish scripts
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Check workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          checks=$(gh pr checks "$PR_NUMBER" --json bucket,workflow)
          jq -e '[.[] | select(.workflow == "Check")] |
            length > 0 and all(.[]; .bucket == "pass")' <<< "$checks"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate tag and scripts
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$RELEASE_BRANCH" =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          printf 'RELEASE_TAG=%s\n' "${RELEASE_BRANCH#dev/}" >> "$GITHUB_ENV"
          LINUX_TOOLBOX_BIN_DIR="$RUNNER_TEMP" bash install-shell-tools.sh
          export PATH="$RUNNER_TEMP:$PATH"
          make check
      - name: Prepare pinned installer
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir dist
          cp -- *.sh dist/
          sed -i "s#^base_url=.*#base_url=https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}#" dist/install.sh
          grep -Fx "base_url=https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}" dist/install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          release_args=()
          [[ "$RELEASE_TAG" == *-* ]] && release_args+=(--prerelease)
          gh release create "$RELEASE_TAG" dist/*.sh --target "$MERGE_SHA" --generate-notes "${release_args[@]}"
