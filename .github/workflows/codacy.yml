name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 8 * * 5'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Code scanning rejects several runs from the same tool, and Codacy runs some tools (opengrep) more than once.
      # Results keep ruleId and uri, so the per-run ruleIndex and artifact index can be dropped safely.
      # MD013 (line length) is dropped: the README keeps paragraphs and tables on one line, and each hit on a
      # changed line becomes a PR conversation that the main ruleset requires resolving before merge.
      - name: Merge SARIF runs per tool
        run: |
          jq '.runs |= (group_by(.tool.driver.name) | map(.[0] + {
            tool: {driver: (.[0].tool.driver + {rules: ([.[].tool.driver.rules[]] | unique_by(.id))})},
            results: [.[].results[] | select(.ruleId != "markdownlint_MD013")
              | del(.ruleIndex, .locations[].physicalLocation.artifactLocation.index)],
            invocations: [.[].invocations[]],
            artifacts: ([.[].artifacts[]] | unique)
          }))' results.sarif > merged.sarif

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged.sarif
